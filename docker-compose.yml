version: '3.8'

services:
  cctv_backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cctv_maintenance_api
    ports:
      - "5000:5000"
    volumes:
      - cctv_data:/app/data
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production

volumes:
  cctv_data:
    driver: local
